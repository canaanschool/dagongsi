<link rel="manifest" href="manifest.json">
<style>
  :root{
    --paper:#FBF6F1; --card:#FFFFFF; --ink:#413A34; --ink2:#7C7169;
    --line:#DCD1C6; --line2:#C2B4A7; --half:#EFE7E0; --soft:#F6EDE5;
    --c7:#C0533A; --gap:#F2EAE2;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:var(--paper);color:var(--ink);
    padding-top:calc(16px + env(safe-area-inset-top));
    font-family:Pretendard,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',system-ui,sans-serif;
    padding:16px 20px 190px;font-size:14px}
  .wrap{max-width:1240px;margin:0 auto}
  input,textarea{font:inherit;color:var(--ink);background:transparent;border:none;outline:none}
  input::placeholder,textarea::placeholder{color:#C6B9AD}
  .btn{font:inherit;font-weight:700;font-size:12.5px;background:transparent;color:var(--ink2);
    border:1px solid var(--line2);border-radius:999px;padding:7px 13px;cursor:pointer}
  .btn:active{background:var(--soft)}

  .brand{display:flex;align-items:center;gap:10px;margin-bottom:11px}
  .brand .mark{height:27px;width:auto;display:block}
  .brand .name{font-size:20px;font-weight:800;letter-spacing:-1px;line-height:1}
  .brand .full{font-size:11.5px;font-weight:600;color:var(--ink2);letter-spacing:-.2px}
  .brand .school{margin-left:auto;height:21px;width:auto;display:block;opacity:.92}
  .ver{font-size:10px;font-weight:700;color:#C3B7AB;margin-left:8px;letter-spacing:0}
  .bar2{display:flex;align-items:center;gap:7px;flex-wrap:wrap;
    padding-bottom:11px;margin-bottom:13px;border-bottom:1px solid var(--line)}
  .vr{width:1px;height:20px;background:var(--line);margin:0 4px}
  .promise{display:none;align-items:flex-start;gap:10px;background:#F3EDE6;
    border-left:4px solid var(--c7);border-radius:10px;padding:11px 14px;margin-bottom:14px}
  .promise.on{display:flex}
  .promise b{flex:0 0 auto;font-size:11px;font-weight:800;color:#fff;background:var(--c7);
    border-radius:5px;padding:3px 7px;margin-top:1px}
  .promise span{font-size:13.5px;font-weight:700;line-height:1.5}
  .phead{display:flex;align-items:baseline;gap:9px;margin-bottom:10px;flex-wrap:wrap}
  .phead h2{font-size:18px}
  .ph-sub{font-size:11.5px;color:var(--ink2);font-weight:500}
  .ph-sub.legend{margin-left:auto;text-align:right;display:flex;align-items:center;flex-wrap:wrap;
    gap:2px 0;justify-content:flex-end}
  .ph-sub.legend b{color:var(--ink);font-weight:800;margin-right:2px}
  .ph-sub.legend .sep{margin:0 8px;color:var(--line2)}
  .ph-sub.legend .note{flex-basis:100%;text-align:right;margin-top:2px;color:var(--ink2);opacity:.8}
  .phead .right{margin-left:auto;display:flex;align-items:center;gap:6px}
  .tabs{display:flex;gap:6px}
  .tab{font:inherit;font-size:13px;font-weight:800;letter-spacing:-.3px;padding:7px 14px;
    border-radius:999px;border:1.5px solid transparent;background:transparent;color:var(--ink2);cursor:pointer}
  .tab.on{background:var(--card);border-color:var(--line2);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .who{margin-left:auto;display:flex;align-items:center;gap:9px;background:var(--card);
    border:1px solid var(--line);border-radius:999px;padding:6px 8px 6px 14px}
  .who b{font-size:13px;font-weight:800}
  .who span{font-size:12px;color:var(--ink2);font-weight:700}
  .who{cursor:default;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  .who.press{background:var(--soft)}
  .stat{font-size:11.5px;font-weight:700;color:var(--ink2);min-width:60px;text-align:right}
  .rf{border:1px solid var(--line2);background:var(--card);border-radius:50%;
    width:27px;height:27px;cursor:pointer;font-size:13px;color:var(--ink2);line-height:1;
    display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
  .rf:active{background:var(--soft)}
  .rf.spin{animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .stat.err{color:var(--c7)}
  .panel{display:none} .panel.on{display:block}

  .wk{border:1px solid var(--line2);background:var(--card);border-radius:8px;width:27px;height:27px;
    cursor:pointer;font-size:13px;font-weight:800;color:var(--ink2)}
  .wklabel{font-size:13.5px;font-weight:800;letter-spacing:-.3px;white-space:nowrap}
  .wklabel em{font-size:11.5px;font-weight:600;color:var(--ink2);font-style:normal;margin-left:5px}

  .board{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;overflow-x:auto}
  .gridbox{display:grid;grid-template-columns:50px 38px 1fr;min-width:1080px;
    user-select:none;-webkit-user-select:none}
  .gridbox.paint{touch-action:none}   /* 항목을 고르면 칠하기 제스처가 스크롤보다 우선합니다 */
  .hlabels{grid-column:3;position:relative;height:17px;border-bottom:1.5px solid var(--line2)}
  .hlabels span{position:absolute;bottom:4px;transform:translateX(-50%);
    font-size:10px;font-weight:700;color:var(--ink2);white-space:nowrap}
  .hlabels span.first{transform:none;left:0}
  .hlabels span.last{transform:none;right:0;left:auto}
  .spacer{border-bottom:1.5px solid var(--line2)}
  .day{grid-column:1;grid-row:span 2;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:1px;font-size:13px;font-weight:800;background:var(--soft);
    border-right:1.5px solid var(--line2);border-bottom:1.5px solid var(--line2)}
  .day i{font-style:normal;font-size:9.5px;font-weight:700;color:var(--ink2)}
  .kind{display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;
    color:var(--ink2);border-right:1.5px solid var(--line2)}
  .kind.p{border-bottom:1px solid var(--line)}
  .kind.r{border-bottom:1.5px solid var(--line2)}
  .track{position:relative;cursor:pointer;background-color:var(--gap);
    background-image:
      repeating-linear-gradient(45deg,transparent 0 4px,rgba(0,0,0,.035) 4px 5px),
      linear-gradient(to right,var(--half) 0 1px,transparent 1px 100%),
      linear-gradient(to right,var(--line) 0 1px,transparent 1px 100%);
    background-size:auto,calc(100%/36) 100%,calc(100%/18) 100%;
    border-right:1px solid var(--line)}
  .track.p{height:32px;border-bottom:1px solid var(--line)}
  .track.r{height:40px;border-bottom:1.5px solid var(--line2)}
  .seg{position:absolute;top:0;bottom:0;border-right:1px solid rgba(255,255,255,.5)}
  .nowline{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);
    z-index:4;pointer-events:none;opacity:.85}
  .nowline.head:before{content:'';position:absolute;top:-3px;left:-3px;
    width:8px;height:8px;border-radius:50%;background:var(--ink)}
  .lab{position:absolute;top:0;bottom:0;display:flex;align-items:center;justify-content:center;
    font-size:10.5px;font-weight:800;letter-spacing:-.2px;overflow:hidden;white-space:nowrap;
    pointer-events:none;z-index:2;text-shadow:0 1px 2px rgba(0,0,0,.22)}

  .tray{position:fixed;left:0;right:0;bottom:0;background:rgba(251,246,241,.96);
    backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:11px 20px 14px;z-index:20}
  .tray.hide{display:none}
  .tray .inner{max-width:1240px;margin:0 auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .chip{display:flex;align-items:center;gap:7px;border:1.5px solid transparent;background:var(--card);
    border-radius:999px;padding:8px 14px 8px 10px;font-size:13px;font-weight:700;color:var(--ink);
    cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.05)}
  .chip .sw{width:15px;height:15px;border-radius:5px;flex:0 0 auto}
  .chip.sel{border-color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.13)}
  .help{width:auto;max-width:640px;text-align:left}
  .help h3{margin-bottom:10px}
  .help h4{font-size:13px;font-weight:800;margin:14px 0 5px}
  .help ul{margin:0;padding-left:17px}
  .help li{font-size:12.5px;color:var(--ink2);font-weight:500;line-height:1.75;margin-bottom:2px}
  .help li b{color:var(--ink);font-weight:800}
  .helpbody{max-height:64vh;overflow-y:auto;padding-right:4px}
  .trayNote{font-size:11.5px;color:var(--ink2);font-weight:500;margin-left:auto;text-align:right;line-height:1.55}

  .sumhead{display:flex;align-items:baseline;gap:10px;margin:18px 0 9px;flex-wrap:wrap}
  h2{font-size:17px;font-weight:800;letter-spacing:-.3px}
  .legend{font-size:11.5px;color:var(--ink2);font-weight:600}
  .board2{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;overflow-x:auto}
  table.sum{border-collapse:collapse;width:100%;min-width:640px;table-layout:fixed}
  table.sum col.it{width:112px}
  .sum th{font-size:11.5px;font-weight:700;color:var(--ink2);padding:7px 0;text-align:center;
    background:var(--soft);border:1px solid var(--line);border-bottom:1.5px solid var(--line2)}
  .sum td{border:1px solid var(--line);text-align:center;padding:6px 0;height:40px}
  .sum td.it{text-align:left;padding-left:11px;font-size:12.5px;font-weight:700;border-right:1.5px solid var(--line2)}
  .sum td.it .sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px}

const store = {
  async get(k){
    if(window.storage && window.storage.get) return await window.storage.get(k);
    const v = localStorage.getItem(k);
    if(v === null) throw new Error('없음');
    return { key:k, value:v };
  },
  async set(k, v){
    if(window.storage && window.storage.set) return await window.storage.set(k, v);
    localStorage.setItem(k, v);
    return { key:k, value:v };
  }
};

    <div class="err" id="merr"></div>`;
  bindForm(edit);
}
function bindForm(edit){
  if($('mx')) $('mx').onclick=()=>$('veil').classList.add('hide');
  if($('mswap')){
    $('mswap').textContent = manualMode ? '명단에서 고르기' : '명단에 없어요 · 직접 적기';
    $('mswap').onclick=()=>{ manualMode=!manualMode;
      $('mbody').innerHTML = manualMode?manualForm():rosterForm(); bindForm(edit); };
  }
  if($('mc')) $('mc').onchange=()=>{
    const mine=ROSTER.filter(r=>clsKey(r)===$('mc').value);
    $('ms').innerHTML = mine.map(r=>`<option value="${r.num}|${esc(r.name)}">${r.num}번 ${esc(r.name)}</option>`).join('');
  };
  $('mgo').onclick=()=>{
    if(edit && $('mp').value!==PIN){ $('merr').textContent='비밀번호가 다릅니다'; return; }
    let g,c,n,i;
    if(manualMode){
      g=$('mg').value.trim(); c=$('ml').value.trim(); n=$('mn').value.trim(); i=$('mi').value.trim();
      if(!g||!c||!n||!i){ $('merr').textContent='네 칸을 모두 적어주세요'; return; }
    }else{
      const m=String($('mc').value).match(/(\d+)학년\s*(\d+)반/);
      if(!m||!$('ms').value){ $('merr').textContent='명단에서 골라주세요'; return; }
      g=m[1]; c=m[2];
      const v=$('ms').value.split('|'); n=v[0]; i=v.slice(1).join('|');
    }
    switchProfile({grade:g,cls:c,num:n,name:i});
  };
}
async function switchProfile(np){
  const same = profile && profile.grade===np.grade && String(profile.cls)===String(np.cls)
            && String(profile.num)===String(np.num);
  if(ready && !same) await saveWeek();   /* 이전 학생 것부터 저장 */
  profile=np; saveProfile(); paintWho();
  $('veil').classList.add('hide');
  if(!same){ ready=false; await goWeek(curWeek); }
  queueSync();
}
function paintWho(){
  if(!profile) return;
  $('whoName').textContent=profile.name;
  $('whoNo').textContent=`${profile.grade}학년 ${profile.cls?profile.cls+'반 ':''}${profile.num}번`;
}
/* 이름을 3초 길게 누르면 정보 수정 */
(function(){
  const el=$('whoName').parentElement; let t=null;
  const start=()=>{ el.classList.add('press');
    t=setTimeout(()=>{ el.classList.remove('press'); askProfile(true); },3000); };
  const stop=()=>{ el.classList.remove('press'); clearTimeout(t); };
  el.addEventListener('pointerdown',start);
  ['pointerup','pointerleave','pointercancel','pointermove'].forEach(v=>el.addEventListener(v,stop));
  el.addEventListener('contextmenu',e=>e.preventDefault());
})();

/* ══ 주차 ══ */
function weekNo(w){
  const s0=mondayOf(new Date(SEMESTER_START+'T00:00:00'));
  const n=Math.round((new Date(w+'T00:00:00')-s0)/604800000)+1;
  return n;
}
function paintWeek(){
  const a=new Date(curWeek+'T00:00:00'), b=addD(a,5);
  const now=ymd(mondayOf(new Date()));
  const n=weekNo(curWeek);
  const head = n>=1 ? `${n}주차` : `${a.getFullYear()}년`;
  $('wkLabel').innerHTML =
    `${head} <em>${a.getMonth()+1}/${a.getDate()} ~ ${b.getMonth()+1}/${b.getDate()}</em>`
    + (curWeek===now?'<em>· 이번 주</em>':'');
  $('thisW').style.display = curWeek===now ? 'none' : '';
}
let ready=false;
async function goWeek(w){
  if(ready) await saveWeek();
  curWeek=w; W=blankWeek();
  let r=null;
  try{ r=await store.get(wkKey(w)); }
  catch(e){ try{ r=await store.get('sdl:w:'+w); }catch(e2){} }
  if(r&&r.value){
    try{ const d=JSON.parse(r.value);
      W.plan=d.plan||{}; W.run=d.run||{}; W.detail=d.detail||{}; W.rev=+(d.rev||0);
      W.name=d.name||{plan:{},run:{}};
      if(!W.name.plan) W.name.plan={};
      if(!W.name.run)  W.name.run={};
      migrateDetail();
      DAYS.forEach(k=>{
        if(!d.daily||!d.daily[k]) return;
        const src=d.daily[k];
        if(Array.isArray(src.todos)) src.todos=src.todos.map(t=>Object.assign(blankTodo(),
          {p:t.p||'', t:t.t||'', st:(t.st!==undefined?t.st:(t.done?100:0)),
           src:t.src||'', key:t.key||'', edited:!!t.edited,
           ps:t.ps||'', pe:t.pe||'', est:t.est||'', rs:t.rs||'', re:t.re||'',
           tedited:!!t.tedited}));
        W.daily[k]=Object.assign(blankDay(), src);
      });
    }catch(e){}
  }
  const hadLocal=!!(r&&r.value);
  ready=true;
  paintWeek(); buildGrid(); redraw(); renderSum(); buildDayTabs(); renderDaily();
  saveProfile(); pullPromise();

  /* 시트 확인은 뒤에서 합니다. 화면이 늦게 뜨지 않도록 */
  const week0=curWeek, tick0=dirtyTick;
  blockPush=false;
  pullWeek(hadLocal).then(res=>{
    if(curWeek!==week0) return;                 /* 그새 주차를 옮겼으면 그만둡니다 */
    if(res==='err' && !hadLocal){
      /* 이 기기에 기록이 없는데 시트도 확인하지 못했습니다.
         이 상태로 저장이 돌면 시트의 기록을 빈 것으로 덮어씁니다 */
      blockPush=true;
      setStat('기록을 확인하지 못했습니다 · 새로고침해 주세요', true);
      return;
    }
    if(res!=='got') return;
    if(dirtyTick!==tick0){                      /* 그새 학생이 고쳤으면 덮지 않습니다 */
      setStat('기기에 적은 것을 그대로 둡니다'); return;
    }
    saveWeek();
    paintWeek(); buildGrid(); redraw(); renderSum(); buildDayTabs(); renderDaily();
    setStat('시트에서 불러옴');
  });
}
$('prevW').onclick=()=>goWeek(ymd(addD(new Date(curWeek+'T00:00:00'),-7)));
$('nextW').onclick=()=>goWeek(ymd(addD(new Date(curWeek+'T00:00:00'), 7)));
$('thisW').onclick=()=>goWeek(ymd(mondayOf(new Date())));

  if(!w) renderDaily(); else { redraw(); drawNow(); }

/* ══ 숫자키로 항목 고르기 (기존 클릭 방식은 그대로) ══ */
document.addEventListener('keydown', e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(!$('veil').classList.contains('hide')) return;      /* 창이 떠 있으면 무시 */
  if(!$('pw').classList.contains('on')) return;          /* 주간 계획 실행표에서만 */
  const t=e.target, tag=t&&t.tagName;
  if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||(t&&t.isContentEditable)) return;
  if(!/^[0-9]$/.test(e.key)) return;
  const n=+e.key;
  if(n<1 || n>CATS.length) return;
  sel = (sel===CATS[n-1].k) ? '' : CATS[n-1].k;   /* 같은 숫자를 다시 누르면 풀립니다 */
  e.preventDefault();
  buildTray();
});

/* ══ 격자 ══ */
function buildGrid(){
  let h='<div class="spacer"></div><div class="spacer"></div><div class="hlabels">';
  for(let i=0;i<=NH;i++){
    const cls=i===0?' class="first"':(i===NH?' class="last"':'');
    h+=`<span${cls} style="left:${i/NH*100}%">${pad(H0+i)}</span>`;
  }
  h+='</div>';
  DAYS.forEach((d,di)=>{
    const dt=dateOf(di);
    h+=`<div class="day">${d}<i>${dt.getMonth()+1}/${dt.getDate()}</i></div>`;
    h+=`<div class="kind p">계획</div><div class="track p" data-m="plan" data-d="${di}"></div>`;
    h+=`<div class="kind r">실행</div><div class="track r" data-m="run"  data-d="${di}"></div>`;
  });
  $('grid').innerHTML=h;
}
function runsOf(mode,di,filter){
  const store=W[mode], out=[]; let i=0;
  while(i<NS){
    const k=store[`${di}-${i}`];
    if(!k||(filter&&!filter.includes(k))){i++;continue;}
    const nm=nameAt(mode,di,i);
    let j=i;
    while(j+1<NS && store[`${di}-${j+1}`]===k && nameAt(mode,di,j+1)===nm) j++;
    out.push({k,s:i,e:j+1,nm}); i=j+1;
  }
  return out;
}
const sameCell=(di,i)=>{
  const p=W.plan[`${di}-${i}`], r=W.run[`${di}-${i}`];
  if(!p||p!==r) return null;
  if(nameAt('plan',di,i)!==nameAt('run',di,i)) return null;   /* 이름까지 같아야 합니다 */
  return p;
};
function matchRuns(di){
  const out=[]; let i=0;
  while(i<NS){
    const p=sameCell(di,i);
    if(!p){i++;continue;}
    let j=i;
    while(j+1<NS){
      const p2=sameCell(di,j+1);
      if(p2&&p2===p && nameAt('plan',di,j+1)===nameAt('plan',di,i)) j++; else break;
    }
    out.push({k:p,s:i,e:j+1}); i=j+1;
  }
  return out;
}
const pc=r=>`left:${r.s/NS*100}%;width:${(r.e-r.s)/NS*100}%`;

/* 이름을 붙이면 같은 계열 안에서 밝기만 달라집니다.
   색 자체는 그대로라 '무슨 항목인지'는 계속 한눈에 보입니다 */
function shade(hex, name){
  if(!name) return hex;
  let h=0; for(let i=0;i<name.length;i++) h=(h*31+name.charCodeAt(i))>>>0;
  const step=[-16, 14, -30, 28, -44][h%5];      /* 어둡게 · 밝게 번갈아 */
  const n=parseInt(hex.slice(1),16);
  const cl=v=>Math.max(0,Math.min(255,v+step));
  const r=cl(n>>16&255), g=cl(n>>8&255), b=cl(n&255);
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
function drawTrack(el){
  const di=+el.dataset.d, mode=el.dataset.m;
  const segs=runsOf(mode,di), fits=matchRuns(di);
  let h='';
  segs.forEach(r=>{const c=cat(r.k);
    h+=`<div class="seg" style="${pc(r)};background:${shade(c.c,r.nm)}${FADE}"></div>`;});
  fits.forEach(r=>{const c=cat(r.k), nm=nameAt('plan',di,r.s);
    h+=`<div class="seg" style="${pc(r)};background:${shade(c.c,nm)}"></div>`;});
  segs.forEach(r=>{const c=cat(r.k); if(r.e-r.s<2) return;
    h+=`<div class="lab" style="${pc(r)};color:${c.t}">${esc(r.nm||c.n)}</div>`;});
  el.innerHTML=h;
}
const redrawDay=di=>document.querySelectorAll(`.track[data-d="${di}"]`).forEach(drawTrack);

/* 지금 시각을 오늘 줄에만 세로선으로 표시합니다
   06시 이전이나 24시 이후, 다른 주를 보고 있을 때는 그리지 않습니다 */
function drawNow(){
  document.querySelectorAll('.nowline').forEach(el=>el.remove());
  const now=new Date();
  if(ymd(mondayOf(now))!==curWeek) return;
  const di=(now.getDay()+6)%7;          /* 월=0 */
  if(di>5) return;                       /* 일요일은 표가 없습니다 */
  const h=now.getHours()+now.getMinutes()/60;
  if(h<H0 || h>H0+NH) return;
  const left=((h-H0)/NH)*100;
  document.querySelectorAll(`.track[data-d="${di}"]`).forEach((el,i)=>{
    const d=document.createElement('div');
    d.className='nowline'+(i===0?' head':'');
    d.style.left=`calc(${left}% - 1px)`;
    el.appendChild(d);
  });
}

/* 화면으로 돌아오거나 창 크기가 바뀌면 바로 맞춥니다 */
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) drawNow(); });
window.addEventListener('focus', drawNow);
window.addEventListener('pageshow', drawNow);

/* 이름은 칸마다 저장합니다. 이름이 다르면 서로 다른 덩어리가 됩니다.
   예) 06~09시를 공부로 칠하고 앞을 국어, 뒤를 수학으로 이름 붙이면 둘로 나뉩니다 */
function nameAt(mode,d,i){ return ((W.name&&W.name[mode])||{})[`${d}-${i}`] || ''; }
function setName(mode,d,s0,e0,v){
  if(!W.name) W.name={plan:{},run:{}};
  if(!W.name[mode]) W.name[mode]={};
  for(let i=s0;i<e0;i++){
    const k=`${d}-${i}`;
    if(v) W.name[mode][k]=v; else delete W.name[mode][k];
  }
}
/* 칠이 지워진 자리의 이름은 함께 지웁니다 */
function pruneNames(d){
  ['plan','run'].forEach(mode=>{
    const map=(W.name&&W.name[mode])||{};
    Object.keys(map).forEach(k=>{
      const [dd,ii]=k.split('-');
      if(dd===String(d) && !W[mode][k]) delete map[k];
    });
  });
}
/* 예전에는 계획 덩어리의 시작칸에만 세부 내용을 달았습니다.
   그 자료를 칸마다의 이름으로 한 번 옮깁니다 */
function migrateDetail(){
  const det=W.detail||{};
  /* 이미 이름이 있으면 옮길 것이 없습니다 (주마다 따로 판단합니다) */
  if(Object.keys((W.name&&W.name.plan)||{}).length) return;
  if(Object.keys(det).length){
    for(let d=0; d<6; d++){
      runsOfRaw('plan', d).forEach(r=>{
        const v=det[`${d}-${r.s}`];
        if(v) setName('plan', d, r.s, r.e, v);
      });
    }
  }
}
/* 옛 자료를 옮길 때만 쓰는, 이름을 보지 않는 덩어리 나누기 */
function runsOfRaw(mode,di){
  const store=W[mode], out=[]; let i=0;
  while(i<NS){
    const k=store[`${di}-${i}`];
    if(!k){i++;continue;}
    let j=i; while(j+1<NS && store[`${di}-${j+1}`]===k) j++;
    out.push({k,s:i,e:j+1}); i=j+1;
  }
  return out;
}
let pressT=null, pressed=null;
function openDetail(el,x){
  const d=+el.dataset.d, mode=el.dataset.m, slot=slotAt(el,x);
  const runs=runsOf(mode, d);
  const hit=runs.find(r=>slot>=r.s && slot<r.e);
  if(!hit) return;
  const c=cat(hit.k), isPlan=(mode==='plan');
  const label=`${KOR[d]} ${hhmm(hit.s)}~${hhmm(hit.e)} · ${c.n}`;
  $('modal').classList.remove('help');
  $('veil').classList.remove('hide');
  $('modal').innerHTML=`
    <button class="x" id="dx">✕</button>
    <h3>${isPlan?'무엇을 할 계획인가요':'무엇을 했나요'}</h3>
    <p>${esc(label)}</p>
    <div class="mrow"><div class="mfield"><label>이름</label>
      <input id="dt" placeholder="예) 국어" value="${esc(hit.nm)}"></div></div>
    <p class="hintline">이름을 붙이면 그 부분만 따로 떨어져 나옵니다 ·
      비워 두면 다시 ${esc(c.n)}(으)로 합쳐집니다</p>
    <button class="go" id="dgo">저장</button>
    <div class="err"></div>`;
  $('dx').onclick=()=>$('veil').classList.add('hide');
  $('dt').focus();
  const go=()=>{
    setName(mode,d,hit.s,hit.e,$('dt').value.trim());
    $('veil').classList.add('hide');
    DAYS.forEach(k=>syncDay(k));       /* 이어지는 날들까지 함께 맞춥니다 */
    redraw(); renderSum(); renderDaily(); save();
  };
  $('dgo').onclick=go;
  $('dt').addEventListener('keydown',e=>{ if(e.key==='Enter') go(); });
}

let painting=false, mode='set';
const slotAt=(el,x)=>{const r=el.getBoundingClientRect();
  return Math.max(0,Math.min(NS-1,Math.floor((x-r.left)/r.width*NS)));};
function apply(el,x){
  if(!el) return;
  const store=W[el.dataset.m], id=`${el.dataset.d}-${slotAt(el,x)}`;
  if(mode==='erase') delete store[id]; else store[id]=sel;
  if(mode!=='erase') delete ((W.name&&W.name[el.dataset.m])||{})[id];
  pruneNames(+el.dataset.d);
  redrawDay(el.dataset.d); drawNow(); renderSum(); save();
}
$('grid').addEventListener('pointerdown',e=>{
  const t=e.target.closest('.track');
  /* 항목을 고르지 않았을 때만 길게 눌러 이름을 붙입니다
     (고른 상태에서는 칠하기와 겹쳐 오작동합니다) */
  if(!sel && t){
    pressed={el:t, x:e.clientX};
    clearTimeout(pressT);
    pressT=setTimeout(()=>{ openDetail(t, e.clientX); pressed=null; }, 500);
  }
  if(!sel) return;                       /* 아무 항목도 고르지 않았으면 칠하지 않습니다 */
  const el=e.target.closest('.track'); if(!el) return;
  const id=`${el.dataset.d}-${slotAt(el,e.clientX)}`;
  mode=(W[el.dataset.m][id]===sel)?'erase':'set';
  painting=true; $('grid').setPointerCapture(e.pointerId); apply(el,e.clientX); e.preventDefault();
});
$('grid').addEventListener('pointermove',e=>{
  if(!painting) return;
  const t=document.elementFromPoint(e.clientX,e.clientY);
  apply(t&&t.closest?t.closest('.track'):null,e.clientX);
});
['pointerup','pointercancel'].forEach(v=>$('grid').addEventListener(v,()=>{
  painting=false; clearTimeout(pressT); pressed=null;
}));
$('grid').addEventListener('pointermove',e=>{
  if(pressed && Math.abs(e.clientX-pressed.x)>6){ clearTimeout(pressT); pressed=null; }
});

function buildTray(){

    `<button class="chip${c.k===sel?' sel':''}" data-k="${c.k}">
       <span class="sw" style="background:${c.c}"></span>${c.n}</button>`).join('')
    + `<div class="trayNote">${sel?'선택한 항목을 한 번 더 누르면 선택이 풀립니다'
        :'항목을 골라야 칠할 수 있습니다 · 지금은 띠를 길게 눌러 이름을 붙일 수 있습니다'}<br>
         키보드가 있으면 팔레트 순서대로 1~8 숫자키로 고를 수 있습니다 · 같은 숫자를 다시 누르면 풀립니다<br>
         00~06시 ${SLEEP_FIXED}시간은 잠 · 휴식으로 자동 계산</div>`;
  $('trayIn').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{
    sel = (sel===b.dataset.k) ? '' : b.dataset.k;   /* 같은 항목을 다시 누르면 선택이 풀립니다 */
    buildTray();
  });
  $('grid').classList.toggle('paint', !!sel);   /* 골랐을 때만 스크롤 대신 칠하기 */
}

function tally(m){
  const out={}; CATS.forEach(c=>out[c.k]=Array(6).fill(0));
  const blank=Array(6).fill(NS);
  Object.entries(W[m]).forEach(([id,k])=>{
    const di=+id.split('-')[0];
    if(out[k]){out[k][di]++; blank[di]--;}
  });
  CATS.forEach(c=>out[c.k]=out[c.k].map(v=>v/2));
  out.rest=out.rest.map(v=>v+SLEEP_FIXED);
  const total=DAYS.map((_,i)=>CATS.reduce((a,c)=>a+out[c.k][i],0));

function sortTodos(){
  const rows=D().todos;
  const carry=rows.filter(r=>r.src==='carry' && (r.p.trim()||r.t.trim()));
  const rest=rows.filter(r=>r.src!=='carry');
  const used=rest.filter(r=>r.p.trim()||r.t.trim());
  const free=rest.filter(r=>!(r.p.trim()||r.t.trim()));
  used.sort((a,b)=>{
    const x=parseFloat(a.p), y=parseFloat(b.p);
    const nx=isNaN(x), ny=isNaN(y);
    if(nx&&ny) return 0;
    if(nx) return 1;
    if(ny) return -1;
    return x-y;
  });
  D().todos=carry.concat(used, free).slice(0,NTODO);
  while(D().todos.length<NTODO) D().todos.push(blankTodo());
}

/* 1234 처럼 숫자만 치면 12:34 로 바뀝니다 */
function fmtTime(v){
  const d=String(v||'').replace(/\D/g,'').slice(0,4);
  if(d.length<=2) return d;
  return d.slice(0,d.length-2)+':'+d.slice(-2);
}
/* 칸을 벗어날 때 12 → 12:00 처럼 마무리합니다 */
function fixTime(v){
  const d=String(v||'').replace(/\D/g,'');
  if(!d) return '';
  if(d.length<=2) return String(+d).padStart(2,'0')+':00';
  return fmtTime(d);
}

  return Math.round(sum/t.length);
}

/* 그 요일 계획에서 공부 · 학원 · 기타 항목을 뽑아 옵니다 */
function planItems(di){
  return runsOf('plan', di, AUTO_CATS).map(r=>({
    key : `p${di}-${r.s}`,
    text: r.nm || cat(r.k).n,
    time: `${hhmm(r.s)}~${hhmm(r.e)}`,
    ps:hhmm(r.s), pe:hhmm(r.e), est:minLabel((r.e-r.s)*30),
    cat : r.k, s:r.s, e:r.e, nm:r.nm
  }));
}
const minLabel=m=>{
  if(!m) return '';
  const h=Math.floor(m/60), n=m%60;
  return (h?`${h}h`:'')+(n?`${n}m`:'');
};
/* 07:10 같은 글자를 분으로, 분을 다시 글자로 */
function toMin(t){
  const m=String(t||'').match(/^(\d{1,2})\s*[:.]?\s*(\d{2})$/);
  if(!m) return null;
  const h=+m[1], n=+m[2];
  if(h>24||n>59) return null;
  return h*60+n;
}
function gapMin(r){
  const a=toMin(r.rs), b=toMin(r.re);
  if(a===null||b===null) return null;
  return (b>=a? b-a : b+1440-a);
}
function estMin(r){
  const m=String(r.est||'').match(/(?:(\d+)\s*h)?\s*(?:(\d+)\s*m)?/);
  if(!m) return null;
  const v=(+(m[1]||0))*60 + (+(m[2]||0));
  return v||null;
}
/* 그 요일 실행에서 같은 항목의 시각을 찾아 옵니다 */
function runTimeFor(di, cat0, ps, nm){
  let runs=runsOf('run', di, [cat0]);
  if(!runs.length) return null;
  /* 이름을 붙였으면 같은 이름의 실행을 먼저 찾습니다.
     계획은 국어인데 그 시각에 수학을 한 경우 엉뚱한 시간이 들어가지 않도록 */
  if(nm){
    const same=runs.filter(r=>r.nm===nm);
    if(same.length) runs=same;
    else return null;
  }
  const p=toMin(ps);
  let best=runs[0], bd=1e9;
  runs.forEach(r=>{
    const d=Math.abs(toMin(hhmm(r.s))-p);
    if(d<bd){ bd=d; best=r; }
  });
  return {rs:hhmm(best.s), re:hhmm(best.e)};
}
/* 하루를 열 때 자동으로 채워 넣습니다
   - 어제 못 끝낸 것 → 맨 위에 '우선'으로
   - 그날 계획에 적은 공부 · 학원 · 기타 → 그 아래로 */
function syncDay(dayKey){
  const di=DAYS.indexOf(dayKey), day=W.daily[dayKey];

  /* 0) 자동으로 들어왔던 빈 줄과, 열쇠 없이 남은 옛 자동 항목은 정리합니다 */
  day.todos.forEach((t,i)=>{
    if(t.src && (!t.t.trim() || !t.key)) day.todos[i]=blankTodo();
  });

  const byKey={};
  day.todos.forEach(t=>{ if(t.key) byKey[t.key]=t; });
  const free=()=>day.todos.findIndex(x=>!x.t.trim() && !x.p.trim() && !x.src);

  /* 1) 어제 못 끝낸 것을 넘겨옵니다. 열쇠는 어제 줄의 정체로 고정합니다 */
  const alive={};
  if(di>0){
    const prev=W.daily[DAYS[di-1]];
    prev.todos.forEach((t,idx)=>{
      /* 반쯤 했거나 내일로 넘긴 것만 넘어갑니다.
         아무것도 고르지 않은 것은 아직 하는 중으로 봅니다 */
      if(!t.t.trim() || (t.st!==50 && t.st!==-1)) return;
      const key='c:'+(t.key || (DAYS[di-1]+':'+idx));
      alive[key]=true;
      if(byKey[key]){ byKey[key].t=t.t; return; }   /* 이미 있으면 내용만 맞춤 */
      const slot=free(); if(slot<0) return;
      day.todos[slot]=Object.assign(blankTodo(),
        {p:'우선', t:t.t, st:0, src:'carry', key});
      byKey[key]=day.todos[slot];
    });
  }
  /* 어제 다 끝냈거나 지운 것은 오늘에서도 사라집니다 */
  day.todos.forEach((t,i)=>{
    if(t.src==='carry' && !alive[t.key]) day.todos[i]=blankTodo();
  });

  /* 2) 그날 계획에서 가져옵니다 */
  const planKeys={};
  planItems(di).forEach(it=>{
    planKeys[it.key]=true;
    const rt=runTimeFor(di, it.cat, it.ps, it.nm) || {rs:'', re:''};
    const has=byKey[it.key];
    if(has){
      if(!has.edited) has.t=it.text;
      if(!has.tedited){ has.ps=it.ps; has.pe=it.pe; has.est=it.est;
                        has.rs=rt.rs; has.re=rt.re; }
      return;
    }
    const slot=free(); if(slot<0) return;
    day.todos[slot]=Object.assign(blankTodo(),
      {p:'', t:it.text, st:0, src:'plan', key:it.key,
       ps:it.ps, pe:it.pe, est:it.est, rs:rt.rs, re:rt.re});
    byKey[it.key]=day.todos[slot];
  });
  /* 계획에서 지워진 것은 오늘에서도 사라집니다 (손대지 않은 것만) */
  day.todos.forEach((t,i)=>{
    if(t.src==='plan' && !planKeys[t.key] && t.st<=0) day.todos[i]=blankTodo();
  });

  sortTodos();
}

/* 일치율 3분할
   slot : 계획한 그 시각에 그 항목을 했나
   day  : 시간대는 달라도 그날 안에 그 항목을 채웠나
   week : 요일도 달라도 그 주 안에 채웠나
   구조상 항상 slot <= day <= week 가 됩니다 */
function fitness(){
  let slot=0, day=0;
  const wp={}, wr={};                    /* 주간 항목별 총량 */
  for(let d=0; d<6; d++){
    slot += matchRuns(d).reduce((a,r)=>a+(r.e-r.s),0);
    const dp={}, dr={};
    for(let i=0;i<NS;i++){
      const p=W.plan[`${d}-${i}`], r=W.run[`${d}-${i}`];
      if(p){ dp[p]=(dp[p]||0)+1; wp[p]=(wp[p]||0)+1; }
      if(r){ dr[r]=(dr[r]||0)+1; wr[r]=(wr[r]||0)+1; }
    }
    Object.keys(dp).forEach(k=>{ day += Math.min(dp[k], dr[k]||0); });
  }
  let week=0;
  Object.keys(wp).forEach(k=>{ week += Math.min(wp[k], wr[k]||0); });
  const planned = Object.values(wp).reduce((a,b)=>a+b,0);
  return { plan:planned/2, slot:slot/2, day:day/2, week:week/2 };
}

/* 격자를 짧은 글자로 압축합니다. 요일마다 36칸, 항목은 한 글자
   교사용 화면에서 이 문자열로 그 주 격자를 그대로 되살립니다 */
const CODE1 = {pray:'P', school:'S', rest:'R', acad:'A', play:'L', etc:'E', study:'T', fill:'F'};
function packGrid(mode){
  return DAYS.map((_,d)=>{
    let out='';
    for(let i=0;i<NS;i++){ const k=W[mode][`${d}-${i}`]; out += k?CODE1[k]:'.'; }
    return out;
  }).join('|');
}

/* 일일학습계획표를 교사용에서 읽기 전용으로 되살리기 위한 재료입니다.
   빈 줄과 빈 값은 빼서 보내는 양을 줄입니다 */
function packDaily(){
  const out={};
  DAYS.forEach(k=>{
    const d=W.daily[k], o={};
    const rows=(d.todos||[]).filter(r=>String(r.t||'').trim()||String(r.p||'').trim())
      .map(r=>{
        const t={t:String(r.t||''), st:r.st|0};
        if(String(r.p||'').trim()) t.p=String(r.p);
        ['ps','pe','est','rs','re'].forEach(f=>{ if(String(r[f]||'').trim()) t[f]=String(r[f]); });
        /* 되살릴 때 자동 항목이 겹쳐 들어오지 않도록 정체도 함께 담습니다 */
        if(r.src) t.src=r.src;
        if(r.key) t.key=r.key;
        if(r.edited)  t.edited=1;
        if(r.tedited) t.tedited=1;
        return t;
      });
    if(rows.length) o.rows=rows;
    ['verse','action','thanks','eval'].forEach(f=>{
      if(String(d[f]||'').trim()) o[f]=String(d[f]).trim(); });
    const tmr=(d.tmr||[]).map(x=>String(x||'').trim()).filter(Boolean);
    if(tmr.length) o.tmr=tmr;
    if(Object.keys(o).length) out[k]=o;
  });
  return out;
}

/* ── 시트에서 되살리기 ──
   기록은 기기에 저장되지만, 기기를 바꾸거나 사파리 자료를 지우면 비어 버립니다.
   그래서 앱을 열 때 시트 쪽이 더 최신이면 그것을 가져옵니다.
   시계 대신 판 번호(rev)로 견줍니다. 기기마다 시각이 다를 수 있어서입니다 */
const CODE1R={}; Object.keys(CODE1).forEach(k=>CODE1R[CODE1[k]]=k);
function unpackGrid(str, into){
  String(str||'').split('|').forEach((row,d)=>{
    for(let i=0;i<row.length;i++){ const c=CODE1R[row[i]]; if(c) into[`${d}-${i}`]=c; }
  });
}
function spreadNames(list){
  const out={};
  Object.keys(list||{}).forEach(d=>{
    (list[d]||[]).forEach(r=>{ for(let i=r.s;i<r.e;i++) out[`${d}-${i}`]=r.n; });
  });
  return out;
}
function adoptSheet(g){
  W.plan={}; W.run={}; W.detail={}; W.name={plan:{},run:{}};
  unpackGrid(g.p, W.plan); unpackGrid(g.r, W.run);
  W.name.plan=spreadNames(g.np); W.name.run=spreadNames(g.nr);
  DAYS.forEach(k=>W.daily[k]=blankDay());
  const src=g.d||{}, why=g.w||{};
  DAYS.forEach(k=>{
    const o=src[k]; const day=W.daily[k];
    if(o){
      ['verse','action','thanks','eval'].forEach(f=>{ if(o[f]) day[f]=String(o[f]); });
      if(Array.isArray(o.tmr)) o.tmr.forEach((v,i)=>{ if(i<day.tmr.length) day.tmr[i]=String(v||''); });
      if(Array.isArray(o.rows)) o.rows.forEach((r,i)=>{
        if(i<day.todos.length) day.todos[i]=Object.assign(blankTodo(), r,
          {edited:!!r.edited, tedited:!!r.tedited});
      });
    }
    if(Array.isArray(why[k])) day.why=why[k].slice();
  });
  W.rev=+(g.rev||0);
}
let dirtyTick=0, blockPush=false;
/* 돌려주는 값 : 'got' 가져옴 · 'none' 시트에도 없음 · 'err' 확인 못 함 */
async function pullWeek(hadLocal){
  if(!SHEET_URL || !profile) return 'none';
  try{
    const u=`${SHEET_URL}?what=student&pin=${encodeURIComponent(PIN)}`
      +`&grade=${encodeURIComponent(profile.grade)}&cls=${encodeURIComponent(profile.cls||'')}`
      +`&num=${encodeURIComponent(profile.num)}&t=${Date.now()}`;
    const j=await (await fetch(u)).json();
    if(!j||!j.ok||!Array.isArray(j.rows)) return 'err';
    const row=j.rows.find(r=>String(r.week).trim()===curWeek);
    if(!row||!row.grid) return 'none';
    const g=row.grid;
    if(!g.p && !g.r && !g.d) return 'none';             /* 빈 줄이면 두고 봅니다 */
    if(hadLocal && +(g.rev||0) <= (W.rev||0)) return 'none';
    adoptSheet(g);
    return 'got';
  }catch(e){ return 'err'; }
}

/* 이름 붙은 덩어리를 요일별로 모읍니다 (예: {0:[{s:0,e:6,n:'국어'}]}) */
function packNames(mode){
  const out={};
  for(let d=0; d<6; d++){
    const list=runsOf(mode,d).filter(r=>r.nm).map(r=>({s:r.s,e:r.e,n:r.nm}));
    if(list.length) out[d]=list;
  }
  return out;
}

/* 계획대로 안 된 이유를 요일별로 모읍니다 (예: {mon:['time','focus']}) */
function packWhy(){
  const out={};
  DAYS.forEach(k=>{ const w=W.daily[k].why; if(Array.isArray(w)&&w.length) out[k]=w.slice(); });
  return out;
}

/* 중등 : 예상 시간과 실제 걸린 시간의 차이 */
function timeSense(){
  let est=0, real=0, cnt=0, over=0, under=0, diffAbs=0;
  DAYS.forEach(k=>W.daily[k].todos.forEach(r=>{
    if(!r.t.trim()) return;
    const g=gapMin(r), e=estMin(r);
    if(g===null || !e) return;
    est+=e; real+=g; cnt++; diffAbs+=Math.abs(g-e);
    if(g>e) over++; else if(g<e) under++;
  }));
  if(!cnt) return {tsCount:0, tsEst:'', tsReal:'', tsDiff:'', tsAcc:''};
  const r1=v=>Math.round(v/6)/10;          /* 분 → 시간, 소수 한 자리 */
  return {
    tsCount: cnt,
    tsEst : r1(est), tsReal: r1(real),
    tsDiff: Math.round((real-est)/cnt),    /* 한 건당 평균 차이(분) */
    tsAcc : Math.round((1 - diffAbs/Math.max(est,1))*100)+'%'
  };
}

function summarize(){
  const R=tally('run'), F=fitness();
  let sum=0,tot=0,days=0;
  DAYS.forEach(k=>{
    const t=W.daily[k].todos.filter(x=>x.t.trim());
    if(t.length) days++;
    tot+=t.length;
    sum+=t.reduce((a,r)=>a+Math.max(0,r.st),0);   /* 100 / 50 / 0 · 내일로(-1)는 0 */
  });
  const blank=R.blank.reduce((a,b)=>a+b,0);
  const filled=R.total.reduce((a,b)=>a+b,0);
  return {
    study : R.out.study.reduce((a,b)=>a+b,0),
    rest  : R.out.rest.reduce((a,b)=>a+b,0),
    fill  : R.out.fill.reduce((a,b)=>a+b,0),
    gap   : blank,
    filled,
    fullDays: R.total.filter(v=>v>=24).length,
    logged: Math.round(filled/144*100)+'%',   /* 24시간 중 채운 비율 */
    plan  : F.plan,
    fitSlot: F.slot, fitDay: F.day, fitWeek: F.week,
    rate  : tot?Math.round(sum/tot)+'%':'',
    days,                                            /* 계획표 작성 일수 */
    dayRates: DAYS.map(k=>{const r=dayRate(W.daily[k]); return r===null?'':r+'%';}),
    mid: isMid(),
    ...timeSense(),
    note  : DAYS.map(k=>W.daily[k].eval.trim()).filter(Boolean).join(' / ')
  };
}
let syncT=null;
function queueSync(){ if(!SHEET_URL) return; clearTimeout(syncT); setStat('저장 중'); syncT=setTimeout(push,2500); }
/* 화면을 벗어날 때 아직 못 보낸 것이 있으면 곧바로 내보냅니다.
   2.5초를 기다리다 앱이 닫히면 그 사이 고친 것이 시트에 오르지 못했습니다 */
function flushSync(){
  if(!syncT) return;
  clearTimeout(syncT); syncT=null;
  push(true);
}
document.addEventListener('visibilitychange',()=>{ if(document.hidden) flushSync(); });
window.addEventListener('pagehide', flushSync);
async function push(urgent){
  if(!profile){ return; }
  if(blockPush){ setStat('기록을 확인하지 못했습니다 · 새로고침해 주세요', true); return; }
  syncT=null;
  const body=JSON.stringify({
    token:TOKEN, week:curWeek, grade:profile.grade, cls:profile.cls||'',
    num:profile.num, name:profile.name,
    summary:summarize(),
    grid:{p:packGrid('plan'), r:packGrid('run'), w:packWhy(), d:packDaily(),
          np:packNames('plan'), nr:packNames('run'), rev:W.rev||0, mid:isMid()?1:0}});
  /* 앱이 닫히는 중에는 보통 요청이 끊깁니다.
     sendBeacon 은 화면이 사라진 뒤에도 끝까지 보내 줍니다 */
  if(urgent && navigator.sendBeacon){
    try{
      if(navigator.sendBeacon(SHEET_URL, new Blob([body],{type:'text/plain;charset=UTF-8'}))){
        setStat('동기화됨'); return;
      }
    }catch(e){}
  }
  try{
    const res=await fetch(SHEET_URL,{method:'POST',body, keepalive:!!urgent});
    const j=await res.json();
    if(j&&j.ok) setStat('동기화됨');
    else setStat(j&&j.error==='roster' ? '명단에 없음' : '오류', true);
  }catch(e){ setStat('연결 안 됨',true); }
}
async function pullPromise(){
  if(!SHEET_URL || !profile) return;
  try{
    const u=`${SHEET_URL}?what=promise&grade=${profile.grade}&cls=${profile.cls||''}`
          +`&num=${profile.num}&week=${curWeek}&t=${Date.now()}`;
    const j=await (await fetch(u)).json();
    const t=(j&&j.ok&&j.promise)?String(j.promise).trim():'';
    $('promiseTx').textContent=t;
    $('promise').classList.toggle('on', !!t);
  }catch(e){}
}
async function pullMeta(){
  if(!SHEET_URL) return;
  try{
    const r=await fetch(SHEET_URL+'?t='+Date.now());
    const j=await r.json();
    if(j&&j.devotions) DEV=j.devotions;
    if(j&&j.roster) ROSTER=j.roster;
  }catch(e){}
}
async function save(){
  W.rev=(W.rev||0)+1; dirtyTick++;
  await saveWeek(); saveProfile(); queueSync();
}
$('reset').onclick=()=>{
  W.plan={}; W.run={}; W.detail={}; W.name={plan:{},run:{}};
  DAYS.forEach(k=>W.daily[k]=blankDay());
  redraw(); drawNow(); renderSum(); buildDayTabs(); renderDaily(); save();
};

/* ══ 최신 버전 확인 ══
   앱을 열 때(그리고 다시 앞으로 돌아올 때) 서버의 파일을 살짝 확인해서
   화면에 뜬 것보다 새 버전이 있으면 알아서 다시 불러옵니다 */
let verChecking=false, lastCheck=0;
async function checkUpdate(){
  if(verChecking || Date.now()-lastCheck < 20000) return;
  verChecking=true; lastCheck=Date.now();
  try{
    const r=await fetch(location.pathname+'?v='+Date.now(), {cache:'no-store'});
    const t=await r.text();
    const m=t.match(/const APP_VER = '([^']+)'/);
    if(m && m[1] !== APP_VER){
      await saveWeek();
      location.reload(true);
    }
  }catch(e){}
  verChecking=false;
}
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) checkUpdate(); });
window.addEventListener('focus', checkUpdate);

$('refresh').onclick=async()=>{
  const b=$('refresh'); b.classList.add('spin');
  await saveWeek();
  if(SHEET_URL){ try{ await push(); }catch(e){} }
  lastCheck=0; await checkUpdate();
  location.reload(true);
};

/* ══ 시작 ══ */
(async ()=>{
  $('ver').textContent = APP_VER;
  buildTray(); paintWeek(); buildGrid(); renderSum(); buildDayTabs(); renderDaily();
  try{
    const r=await store.get('sdl:profile');
    if(r&&r.value){ const d=JSON.parse(r.value);
      profile=d.profile||null;
      if(d.curDay&&DAYS.includes(d.curDay)) curDay=d.curDay; }
  }catch(e){}
  setTimeout(checkUpdate, 1500);
  await pullMeta();
  if(profile) paintWho(); else askProfile(false);
  await goWeek(ymd(mondayOf(new Date())));
})();
window.addEventListener('resize', redraw);
</script>
